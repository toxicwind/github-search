[package]
name = "gh-search"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[features]
default = ["web", "mcp"]
web = ["axum", "rust-embed", "mime_guess", "tower-http"]
mcp = ["rmcp", "rmcp-macros", "schemars"]

[dependencies]
gh-search-core = { path = "../core" }
gh-search-cache = { path = "../cache" }
gh-search-context = { path = "../context" }

clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
colored.workspace = true
indicatif.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono.workspace = true
sysinfo = "0.37.2"
dotenvy.workspace = true

# Web server dependencies
axum = { workspace = true, optional = true }
rust-embed = { version = "8.3", optional = true }
mime_guess = { version = "2.0", optional = true }
tower-http = { workspace = true, optional = true }

# MCP dependencies
rmcp = { version = "0.12.0", features = ["server", "transport-io", "macros"], optional = true }
rmcp-macros = { version = "0.12.0", optional = true }
schemars = { version = "1.0", optional = true }
