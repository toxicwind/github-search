[build]
rustc-wrapper = "sccache"
incremental = true
jobs = 8

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "target-cpu=native"]

[profile.dev]
opt-level = 0
debug = 1
incremental = true
overflow-checks = false
lto = false
panic = 'unwind'
split-debuginfo = "unpacked"

[profile.dev.package."*"]
# Don't optimize dependencies in dev mode for faster iteration
opt-level = 0

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = 'abort'
strip = true
incremental = false
